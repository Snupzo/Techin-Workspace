<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      th {
        text-align: left;
        padding-right: 20px;
      }
    </style>
  </head>
  <body style="background: linear-gradient(90deg, blue 0%, magenta 100%);">
    <div
      style="
        padding: 50px;
        background-color: white;
        margin: 50px;
        width: fit-content;
      "
    >
      <div style="width: 80%">
        <p style="font-size: 32px; font-weight: bolder">
          <u style="text-underline-offset: 5px">Re</u>gistration
        </p>
        <form action="">
          <table>
            <tr>
              <label><th>Full Name</th></label>
              <label><th>Username</th></label>
            </tr>
            <tr>
              <th><input type="text" placeholder="Enter your name" /></th>
              <th><input type="text" placeholder="Enter your username" /></th>
            </tr>
            <tr>
              <label for=""><th>Email</th></label>
              <label for=""><th>Phone Number</th></label>
            </tr>
            <tr>
              <th><input type="text" placeholder="Enter your email" /></th>
              <th><input type="text" placeholder="Enter your number" /></th>
            </tr>
            <tr>
              <label for=""><th>Password</th></label>
              <label for=""><th>Confirm Password</th></label>
            </tr>
            <tr>
              <th>
                <input
                  type="password"
                  name=""
                  id=""
                  placeholder="Enter your password"
                />
              </th>
              <th>
                <input
                  type="password"
                  name=""
                  id=""
                  placeholder="Confirm password"
                />
              </th>
            </tr>
          </table>
          <div>
            <p style="font-size: 20px; font-weight: 600">Gender</p>
            <div>
              <label style="padding-right: 20px"
                ><input type="radio" name="" id="" />Male</label
              >
              <label style="padding-right: 20px"
                ><input type="radio" name="" id="" />Female</label
              >
              <label style="padding-right: 20px"
                ><input type="radio" name="" id="" />Prefer not to say</label
              >
            </div>
          </div>
          <button
            style="
              background: linear-gradient(90deg, blue 0%, magenta 100%);
              margin-top: 20px;
              width: 120%;
              height: 40px;
              color: white;
            "
          >
            Register
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
