<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #membersOnline {
        font-size: smaller;
        background-color: lightgray;
        padding: 5px;
        border-radius: 15px;
      }
      td {
        margin: 5px;
      }
      th {
        color: gray;
        text-align: left;
      }
      img {
        width: 50px;
        height: 50px;
        border-radius: 100%;
      }
      .active {
        color: green;
        font-weight: bold;
        background-color: bisque;
        padding: 8px;
        border-radius: 10px;
      }
      .inactive {
        color: darkorange;
        font-weight: bold;
        background-color: yellowgreen;
        padding: 8px;
        border-radius: 10px;
      }
      .offline {
        color: gray;
        font-weight: bold;
        background-color: lightgray;
        padding: 8px;
        border-radius: 10px;
      }
      .Dev {
        color: aqua;
        font-weight: bold;
        background-color: black;
        padding: 8px;
        border-radius: 10px;
        margin-right: 5px;
      }
      .QA {
        color: red;
        font-weight: bold;
        background-color: pink;
        padding: 8px;
        border-radius: 10px;
        margin-right: 5px;
      }
      .Design {
        color: purple;
        font-weight: bold;
        background-color: cadetblue;
        padding: 8px;
        border-radius: 10px;
        margin-right: 5px;
      }
      .Marketing {
        color: orange;
        font-weight: bold;
        background-color: yellow;
        padding: 8px;
        border-radius: 10px;
        margin-right: 5px;
      }
      table {
        border-collapse: collapse;
      }
      a {
        background-color: aliceblue;
        padding: 10px;
        color: black;
      }
    </style>
  </head>
  <body style="background-color: wheat">
    <div
      style="
        margin: 50px;
        background-color: white;
        padding: 20px;
        border-radius: 15px;
        width: fit-content;
      "
    >
      <div style="font-weight: 800; font-size: larger">
        Team Members <span id="membersOnline">(7)Members</span>
      </div>
      <hr />
      <table style="width: 100%">
        <tr>
          <th style="width: 30%">Name</th>
          <th style="width: 15%">Status</th>
          <th style="width: 30%">Email address</th>
          <th style="width: 25%">Tags</th>
        </tr>
        <tr style="background-color: aquamarine">
          <td style="display: flex; align-items: center; gap: 12px">
            <img src="assets/cat1.jpg" alt="cat1" />
            <div>
              <strong>James Alexander</strong><br />
              <span>@james</span>
            </div>
          </td>
          <td><span class="active">active</span></td>
          <td>james@example.com</td>
          <td><span class="Dev">Dev</span><span class="QA">QA</span></td>
        </tr>
        <tr style="background-color: blanchedalmond">
          <td style="display: flex; align-items: center; gap: 12px">
            <img src="assets/cat2.jpg" alt="cat2" />
            <div>
              <strong>Lilia Taylor</strong><br />
              <span>@lilia</span>
            </div>
          </td>
          <td><span class="active">active</span></td>
          <td>lilia.taylor@example.com</td>
          <td>
            <span class="Design">Design</span
            ><span class="Marketing">Marketing</span>
          </td>
        </tr>
        <tr style="background-color: aqua">
          <td style="display: flex; align-items: center; gap: 12px">
            <img src="assets/cat3.jpg" alt="cat3" />
            <div>
              <strong>Drew Cano</strong><br />
              <span>@drew</span>
            </div>
          </td>
          <td><span class="inactive">inactive</span></td>
          <td>drew.crano@example.com</td>
          <td>
            <span class="Design">Design</span
            ><span class="Marketing">Marketing</span>
          </td>
        </tr>
        <tr style="background-color: rgb(246, 210, 156)">
          <td style="display: flex; align-items: center; gap: 12px">
            <img src="assets/cat7.jpg" alt="cat7" />
            <div>
              <strong>Nate Conor</strong><br />
              <span>@nate</span>
            </div>
          </td>
          <td><span class="offline">offline</span></td>
          <td>nate@example.com</td>
          <td><span class="Dev">Dev</span></td>
        </tr>
      </table>
      <br />
      <a href="index.html">1</a>
      <a href="index.html">2</a>
    </div>
  </body>
</html>
